<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ThợViệt – Dành cho doanh nghiệp</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="in nav" id="nav"></div></header><main class="in" id="app"></main>
<script src="shared.js"></script>
<script>
let fq="",fc="",fp="",fs="",rating=5,rImg="";

const card=w=>`<div class="card h" onclick="location.hash='w-${w.id}'">${cph(w)}<div style="margin-top:10px"><b>${esc(w.name)}</b><div class="mu">${ICON[w.cat]} ${w.cat} · ${esc(normCity(w.city))}</div>${badge(w)}</div><div style="margin:8px 0"><span class="st">${stars(avg(w))}</span> <b>${avg(w).toFixed(1)}</b> <span class="mu">(${w.reviews.length})</span></div>${skillTags(w.skills,5)}<div style="margin-top:6px"><b>${rateTxt(w)}</b></div></div>`;
const flt=()=>DB.workers.filter(w=>(!fc||w.cat===fc)&&(!fp||normCity(w.city)===fp)&&(!fs||w.skills.includes(fs))&&(w.name+w.skills.join(" ")+w.city).toLowerCase().includes(fq.toLowerCase())).sort((a,b)=>avg(b)-avg(a));
function vTho(){$("#app").innerHTML=`<h1>Tìm thợ cho dự án của bạn</h1><div class="mu">Xem gian hàng, đánh giá và ảnh công trình thực tế trước khi thuê.</div><div class="bar"><input id="q" placeholder="Tìm tên, kỹ năng, khu vực…" value="${esc(fq)}" style="flex:1;min-width:180px"><select id="c">${catOpts(1)}</select><select id="p">${provSel()}</select><select id="s"><option value="">Tất cả kỹ năng</option>${(fc?SKILLS[fc]:[...new Set(Object.values(SKILLS).flat())]).map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><div class="grid" id="lst">${flt().map(card).join("")}</div>`;$("#c").value=fc;$("#p").value=fp;$("#s").value=fs;$("#s").onchange=e=>{fs=e.target.value;vTho()};$("#p").onchange=e=>{fp=e.target.value;vTho()};
$("#q").oninput=e=>{fq=e.target.value;$("#lst").innerHTML=flt().map(card).join("")||'<p class="mu">Không có kết quả.</p>'};$("#c").onchange=e=>{fc=e.target.value;fs="";vTho()}}
function vProfile(id){const w=wid(id);if(!w){location.hash="tho";return}rating=5;rImg="";
const hf=`<div class="f" id="hf" hidden style="border:1px solid var(--bd);border-radius:10px;padding:12px"><b>Đề nghị thuê</b><select id="hj"><option value="0">— Chọn dự án của tôi (tuỳ chọn) —</option>${DB.jobs.filter(j=>j.by===S.email).map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join("")}</select><input id="hn" placeholder="Tên công việc cần thuê">${moneyInp("hp",w.rate)}<input id="hd" placeholder="Số công dự kiến (VD: 5 công)"><textarea id="ho" placeholder="Ghi chú: địa điểm, ngày bắt đầu…"></textarea><div><button class="btn" id="hs">Gửi đề nghị thuê & nhắn tin</button></div></div>`,
rv=`<div class="card" style="margin-bottom:10px"><b>Viết đánh giá</b> <span class="mu">(với tên ${esc(S.name)})</span><div class="f"><div class="pick" id="pk">${[1,2,3,4,5].map(i=>`<span data-i="${i}" class="on">★</span>`).join("")}</div><textarea id="rt" placeholder="Chia sẻ trải nghiệm làm việc với thợ này…"></textarea><label class="mu">Ảnh minh chứng (tuỳ chọn): <input type="file" accept="image/*" id="ri"></label><div><button class="btn" id="rs">Gửi đánh giá</button></div></div></div>`;
$("#app").innerHTML=`<p style="max-width:680px;margin:8px auto"><a href="#tho">← Quay lại</a></p>${cvPage(w,{act:`<button class="btn g" onclick="openChat(${w.id})">💬 Nhắn tin</button> <button class="btn" id="hb">Thuê</button>`,top:hf,rev:rv})}`;
$("#hb").onclick=()=>{const f=$("#hf");f.hidden=!f.hidden};
$("#hj").onchange=e=>{const j=DB.jobs.find(x=>x.id===+e.target.value);if(j){$("#hn").value=j.title;$("#hp").value=dots(j.budget);$("#hd").value=j.days||""}};
$("#hs").onclick=()=>{const n=$("#hn").value.trim();if(!n){alert("Nhập tên công việc.");return}openChat(w.id,{job:n,jobId:+$("#hj").value,price:moneyVal("hp"),days:$("#hd").value.trim(),note:$("#ho").value.trim(),st:"pending"});$("#hf").hidden=true};
$("#pk").onclick=e=>{const i=+e.target.dataset.i;if(!i)return;rating=i;[...$("#pk").children].forEach((s,k)=>s.classList.toggle("on",k<i))};$("#ri").onchange=e=>rd(e.target.files[0],d=>rImg=d);
$("#rs").onclick=()=>{const t=$("#rt").value.trim();if(!t){alert("Vui lòng nhập nội dung.");return}w.reviews.unshift({n:S.name,s:rating,t,img:rImg,d:new Date().toLocaleDateString("vi-VN")});save();vProfile(id)}}
function vPost(){$("#app").innerHTML=`<h1>Đăng dự án tuyển thợ</h1><div class="card"><div class="f" style="max-width:520px"><input id="a1" placeholder="Tên dự án"><select id="a2">${catOpts()}</select>${cityInp("a3","")}${moneyInp("a4","")}<input id="a5" placeholder="Số công dự kiến (VD: 10 công)"><textarea id="a6" placeholder="Mô tả công việc"></textarea><div><button class="btn" id="sb">Đăng dự án</button></div></div></div>`;
$("#sb").onclick=()=>{const v=i=>$("#a"+i).value.trim();if(!v(1)||!moneyVal("a4")){alert("Vui lòng nhập tên dự án và giá/công.");return}if(!cityOk(normCity(v(3)))){alert("Hãy chọn tỉnh/thành phố trong danh sách gợi ý.");return}DB.jobs.unshift({id:Date.now(),title:v(1),cat:v(2),city:normCity(v(3)),budget:moneyVal("a4"),days:v(5),desc:v(6),by:S.email,byName:S.name,chosen:0,bids:[]});save();location.hash="duan"}}
function vMyJobs(){const l=DB.jobs.filter(j=>j.by===S.email);$("#app").innerHTML=`<h1>Dự án của tôi</h1><div class="mu">Xem báo giá từ thợ và chọn người phù hợp.</div><div style="margin-top:12px;display:grid;gap:12px">${l.map(j=>`<div class="card"><span class="tag">${ICON[j.cat]} ${j.cat}</span><h3 style="margin:6px 0">${esc(j.title)}</h3><div class="mu">📍 ${esc(normCity(j.city))} · 💰 ${esc(j.budget)}${j.days?" · "+esc(j.days):""}</div><p>${esc(j.desc)}</p><b>${j.bids.length} báo giá</b>${j.bids.map(b=>{const w=wid(b.w);return w?`<div class="rv bd"><div><a href="#w-${w.id}">${esc(w.name)}</a> · <b>${esc(b.p)}</b><div class="mu">${esc(b.m)}</div></div><span><button class="btn g" onclick="openChat(${w.id})">💬</button> ${j.chosen===w.id?(j.done?'<span class="tag">🏁 Đã hoàn thành</span>':'<span class="tag">✅ Đã chọn</span>'):j.chosen?"":`<button class="btn g" onclick="choose(${j.id},${w.id})">Chọn thợ</button>`}</span></div>`:""}).join("")}</div>`).join("")||'<p class="mu">Bạn chưa đăng dự án nào. Hãy bấm "Đăng dự án".</p>'}</div>`}
function choose(j,w){DB.jobs.find(x=>x.id===j).chosen=w;save();vMyJobs()}


function route(){if(!guard("biz"))return;const h=location.hash.slice(1)||"tho",isW=/^w-\d+$/.test(h);
if(!["tho","duan","dangduan"].includes(h)&&!isW){location.hash="tho";return}
$("#nav").innerHTML=navHtml("biz",h,isW);
if(isW)vProfile(+h.slice(2));else({tho:vTho,duan:vMyJobs,dangduan:vPost})[h]();scrollTo(0,0)}
addEventListener("hashchange",route);route();chatInit();
</script></body></html>
